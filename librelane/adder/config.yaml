meta:
  version: 3
  flow: Classic

DESIGN_NAME: adder
VERILOG_FILES:
  - dir::../../src/adder.sv

# No clock - the adder is purely combinational
CLOCK_PORT: null

# Power / ground nets
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Floorplan: oversized for the 8-bit adder so the parent's PDN
# stripes have room to cross. Same technique used for the SRAM
# macros: no boundary ring, parent stamps extra stripes over the
# macro and connects to internal M3 horizontal pins via M4-M3 vias.
FP_SIZING: absolute
DIE_AREA: [0, 0, 150, 150]
CORE_AREA: [10, 10, 140, 140]

# SDC for combinational STA (virtual clock + I/O delays)
PNR_SDC_FILE: dir::adder.sdc
SIGNOFF_SDC_FILE: dir::adder.sdc
FALLBACK_SDC_FILE: dir::adder.sdc

PL_TARGET_DENSITY_PCT: 50

# PDN: no boundary ring. Internal stripes are M2 vertical / M3
# horizontal so the parent's M4 PDN can stitch down via M4-M3
# vias to the M3 pins (same pattern as the foundry SRAM macros).
PDN_CORE_RING: False
PDN_ENABLE_PINS: True
PDN_VERTICAL_LAYER: Metal2
PDN_HORIZONTAL_LAYER: Metal3
PDN_VWIDTH: 2
PDN_HWIDTH: 2
PDN_VPITCH: 30
PDN_HPITCH: 30

# Don't error on DRC for the small block during development
ERROR_ON_MAGIC_DRC: False
